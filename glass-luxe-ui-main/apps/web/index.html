<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Critical Preconnects - Must be early in head -->
    <link rel="preconnect" href="https://cdn.sanity.io" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.sanity.io" />
    <link rel="preconnect" href="https://backend.sharifgpt.com" crossorigin />
    <!-- Preload critical font -->
    <link rel="preload" href="/font/Vazirmatn-VariableFont_wght.woff2" as="font" type="font/woff2" crossorigin />
    
    <!-- Preload hero image (fallback) - ensures LCP image is discoverable in initial document -->
    <!-- This will be replaced with Sanity hero image URL at build time if available -->
    <link rel="preload" href="/assets/hero-ai-cubes.png" as="image" fetchpriority="high" data-hero-preload="true" />
    
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    
    <!-- Critical CSS - Inline for fastest FCP -->
    <style>
      /* Critical above-the-fold styles */
      *,*::before,*::after{box-sizing:border-box}
      html,body{margin:0;padding:0;height:100%}
      body{font-family:"Vazirmatn",Tahoma,system-ui,sans-serif;background:#060914;color:rgba(255,255,255,.92);-webkit-font-smoothing:antialiased}
      #root{min-height:100vh}
      /* Use font-display:swap for better performance - shows text immediately with fallback */
      @font-face{font-family:"Vazirmatn";src:url("/font/Vazirmatn-VariableFont_wght.woff2") format("woff2");font-weight:100 900;font-display:swap}
      /* Hero placeholder for instant LCP */
      .hero-placeholder{min-height:92vh;background:#060914}

      /* Static preloaded hero shell (LCP experiment) */
      #preload-hero {
        position: relative;
        min-height: 90vh;
        width: 100%;
        overflow: hidden;
        background: radial-gradient(120% 80% at 85% 50%, rgba(0,0,0,.18) 0%, rgba(0,0,0,.55) 60%, rgba(0,0,0,.70) 100%), 
                    linear-gradient(to bottom right, #0b1024, #0f152f, #0c1028);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 7rem 1.5rem 4rem;
        box-sizing: border-box;
        z-index: 0;
      }

      #preload-hero-inner {
        max-width: 72rem;
        margin: 0 auto;
        text-align: center;
      }

      #preload-hero-bg {
        position: absolute;
        inset: 0;
        z-index: -2;
        overflow: hidden;
      }

      #preload-hero-bg img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 20% 50%;
        display: block;
      }

      #preload-hero-overlay {
        position: absolute;
        inset: 0;
        z-index: -1;
        background:
          radial-gradient(120% 80% at 85% 50%, rgba(0,0,0,.18) 0%, rgba(0,0,0,.55) 60%, rgba(0,0,0,.70) 100%),
          linear-gradient(to bottom right, rgba(30,103,198,0.6), transparent, rgba(139,92,246,0.6));
        mix-blend-mode: soft-light;
        opacity: 0.9;
      }

      #preload-hero-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.35rem 0.9rem;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.2);
        background: rgba(17,24,39,0.35);
        font-size: 0.75rem;
        line-height: 1.4;
        margin-bottom: 1.25rem;
      }

      #preload-hero-badge-dot {
        width: 0.4rem;
        height: 0.4rem;
        border-radius: 999px;
        background: rgb(59,130,246);
      }

      #preload-hero-title {
        font-size: clamp(2rem, 4vw, 3.5rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.1;
        margin: 0 0 1rem;
      }

      #preload-hero-subtitle {
        max-width: 40rem;
        margin: 0 auto 1.75rem;
        font-size: clamp(0.95rem, 2.2vw, 1.2rem);
        line-height: 1.7;
        color: rgba(255,255,255,0.9);
      }

      #preload-hero-cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 1rem 2.5rem;
        border-radius: 1rem;
        border: 1px solid rgba(255,255,255,0.2);
        background: linear-gradient(135deg, rgba(139,92,246,0.2) 0%, rgba(30,103,198,0.2) 100%);
        box-shadow: 0 8px 32px rgba(139,92,246,0.35), inset 0 1px 0 rgba(255,255,255,0.12);
        color: #fff;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        text-decoration: none;
        position: relative;
        overflow: hidden;
      }

      #preload-hero-cta-label {
        position: relative;
        z-index: 1;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #preload-hero-cta-arrow {
        position: relative;
        z-index: 1;
      }

      #preload-hero-cta-shine {
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, transparent, rgba(255,255,255,0.12), transparent);
        opacity: 0;
        transition: opacity 0.6s ease-out;
        pointer-events: none;
        mix-blend-mode: screen;
      }

      #preload-hero-cta:hover #preload-hero-cta-shine {
        opacity: 1;
      }

      @media (max-width: 640px) {
        #preload-hero {
          padding-top: 6rem;
          padding-bottom: 3.5rem;
        }
      }

      /* When React app is mounted, fade out the static hero so it doesn't block interaction */
      .app-mounted #preload-hero {
        opacity: 0;
        pointer-events: none;
        transition: opacity 200ms ease-out;
      }
    </style>

    <!-- Preload runtime-injected styles as soon as they appear to reduce render-blocking -->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const styleLinks = Array.from(document.querySelectorAll('link[rel="stylesheet"]'));
        styleLinks.forEach((link) => {
          if (link.dataset.preloaded === 'true') return;
          const preload = document.createElement('link');
          preload.rel = 'preload';
          preload.as = 'style';
          preload.href = link.href;
          if (link.crossOrigin) preload.crossOrigin = link.crossOrigin;
          preload.dataset.preloaded = 'true';
          document.head.appendChild(preload);
        });
      });
    </script>
    
    <!-- Google Tag Manager - Deferred to avoid blocking initial render -->
    <script>
      // Defer GTM until after page load to improve LCP
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
          setTimeout(function() {
            (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
            new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
            j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.defer=true;j.src=
            'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
            })(window,document,'script','dataLayer','GTM-PW97M4XV');
          }, 2000);
        });
      } else {
        setTimeout(function() {
          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
          new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
          j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.defer=true;j.src=
          'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
          })(window,document,'script','dataLayer','GTM-PW97M4XV');
        }, 2000);
      }
    </script>
    <!-- End Google Tag Manager -->

    <title>SharifGPT - محصولات و خدمات هوش مصنوعی</title>
    <meta name="description" content="SharifGPT - ارائه دهنده محصولات و خدمات هوش مصنوعی" />
    <meta name="author" content="SharifGPT" />

    <meta property="og:title" content="SharifGPT - محصولات و خدمات هوش مصنوعی" />
    <meta property="og:description" content="SharifGPT - ارائه دهنده محصولات و خدمات هوش مصنوعی" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@SharifGPT" />
    <meta name="twitter:image" content="/favicon.png" />
  </head>

  <body>
    <!-- Static hero shell for LCP experiment (renders before React mounts). Vite env flag controls visibility. -->
    <div id="preload-hero">
      <div id="preload-hero-bg">
        <img
          src="/assets/hero-ai-cubes.png"
          alt="Hero background"
          loading="eager"
          fetchpriority="high"
          decoding="async"
        />
      </div>
      <div id="preload-hero-overlay"></div>
      <div id="preload-hero-inner">
        <div id="preload-hero-badge">
          <span id="preload-hero-badge-dot"></span>
          <span>پلتفرم پیشرو در هوش مصنوعی</span>
        </div>
        <h1 id="preload-hero-title">خرید اکانت ChatGPT</h1>
        <p id="preload-hero-subtitle">
          اکانت‌های قانونی ChatGPT با تحویل آنی، اتصال پایدار و پشتیبانی واقعی برای تجربه‌ای بدون دغدغه.
        </p>
        <a id="preload-hero-cta" href="/products">
          <span id="preload-hero-cta-label">مشاهده محصولات</span>
          <span id="preload-hero-cta-arrow">→</span>
          <span id="preload-hero-cta-shine" aria-hidden="true"></span>
        </a>
      </div>
    </div>

    <!-- Feature flag: remove static hero early if VITE_PRELOAD_HERO is not enabled -->
    <script>
      (function () {
        var enabled = "%VITE_PRELOAD_HERO%" === "true";
        if (!enabled) {
          var el = document.getElementById("preload-hero");
          if (el && el.parentNode) {
            el.parentNode.removeChild(el);
          }
        }
      })();
    </script>

    <!-- Google Tag Manager (noscript) -->
    <noscript>
      <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PW97M4XV"
      height="0" width="0" style="display:none;visibility:hidden"></iframe>
    </noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
