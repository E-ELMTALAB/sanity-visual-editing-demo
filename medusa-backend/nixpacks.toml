# Nixpacks configuration for Railway
# This file tells Railway how to build and deploy your Medusa backend

[phases.setup]
nixPkgs = ["nodejs-18_x", "npm-9_x"]

[phases.install]
cmds = ["npm ci --only=production"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start:railway"

[variables]
NODE_ENV = "production"

